eftUpLeg": "leftUpperLeg", "mixamorigLeftLeg": "leftLowerLeg", "mixamorigLeftFoot": "leftFoot", "mixamorigLeftToeBase": "leftToes", "mixamorigRightUpLeg": "rightUpperLeg", "mixamorigRightLeg": "rightLowerLeg", "mixamorigRightFoot": "rightFoot", "mixamorigRightToeBase": "rightToes" };

function findBoneMapping(boneName) {
            if (combinedRigMap[boneName]) {
                return combinedRigMap[boneName];
            }
            const lowerName = boneName.toLowerCase();
            for (const [key, value] of Object.entries(combinedRigMap)) {
                if (key.toLowerCase() === lowerName) {
                    return value;
                }
            }
            for (const [vrmBone, pattern] of Object.entries(namePatterns)) {
                if (pattern.test(boneName)) {
                    return vrmBone;
                }
            }
            return null;
        }

        
function loadHumanoidAnimation(url, vrm) {
            const loader = new FBXLoader();
            loader.crossOrigin = 'anonymous';
            return loader.loadAsync(url).then((asset) => {
                let clip = THREE.AnimationClip.findByName(asset.animations, 'mixamo.com');
                if (!clip && asset.animations.length > 0) {
                    clip = asset.animations[0];
                }
                if (!clip) {
                    throw new Error('No animation found in FBX file');
                }
                const tracks = [];
                const restRotationInverse = new THREE.Quaternion();
                const parentRestWorldRotation = new THREE.Quaternion();
                const _quatA = new THREE.Quaternion();
                const _vec3 = new THREE.Vector3();
                let hipsNode = null;
                asset.traverse((node) => {
                    if (!hipsNode) {
                        const vrmBoneName = findBoneMapping(node.name);
                        if (vrmBoneName === 'hips') {
                            hipsNode = node;
                        }
                    }
                });
                let hipsPositionScale = 1.0;
                if (hipsNode) {
                    const motionHipsHeight = hipsNode.position.y;
                    const vrmHipsY = vrm.humanoid?.getNormalizedBoneNode('hips')?.getWorldPosition(_vec3).y || 1;
                    const vrmRootY = vrm.scene.getWorldPosition(_vec3).y;
                    const vrmHipsHeight = Math.abs(vrmHipsY - vrmRootY);
                    if (motionHipsHeight > 0) {
                        hipsPositionScale = vrmHipsHeight / motionHipsHeight;
                    }
                }
                clip.tracks.forEach((track) => {
                    const trackSplitted = track.name.split('.');
                    const rigBoneName = trackSplitted[0];
                    const vrmBoneName = findBoneMapping(rigBoneName);
                    if (!vrmBoneName) {
                        return;
                    }
                    const vrmNodeName = vrm.humanoid?.getNormalizedBoneNode(vrmBoneName)?.name;
                    const rigNode = asset.getObjectByName(rigBoneName);
                    if (vrmNodeName != null && rigNode) {
                        const propertyName = trackSplitted[1];
                        rigNode.getWorldQuaternion(restRotationInverse).invert();
                        rigNode.parent.getWorldQuaternion(parentRestWorldRotation);
                        if (track instanceof THREE.QuaternionKeyframeTrack) {
                            for (let i = 0; i < track.values.length; i += 4) {
                                const flatQuaternion = track.values.slice(i, i + 4);
                                _quatA.fromArray(flatQuaternion);
                                _quatA.premultiply(parentRestWorldRotation).multiply(restRotationInverse);
                                _quatA.toArray(flatQuaternion);
                                flatQuaternion.forEach((v, index) => {
                                    track.values[index + i] = v;
                                });
                            }
                            tracks.push(
                                new THREE.QuaternionKeyframeTrack(
                                    `${vrmNodeName}.${propertyName}`,
                                    track.times,
                                    track.values.map((v, i) => (vrm.meta?.metaVersion === '0' && i % 2 === 0 ? - v : v)),
                                ),
                            );
                        } else if (track instanceof THREE.VectorKeyframeTrack) {
                            const value = track.values.map((v, i) => (vrm.meta?.metaVersion === '0' && i % 3 !== 1 ? - v : v) * hipsPositionScale);
                            tracks.push(new THREE.VectorKeyframeTrack(`${vrmNodeName}.${propertyName}`, track.times, value));
                        }
                    }
                });
                return new THREE.AnimationClip('vrmAnimation', clip.duration, tracks);
            });
        }

const W=900,H=1400;

r.setSize(W,H); r.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(26,W/H,0.1,50);

const dl=new THREE.DirectionalLight(0xfff0e8,1.5); dl.position.set(1.2,1.8,2.2); scene.add(dl);

window.loadVrm=async(url)=>{
  const loader=new GLTFLoader(); loader.register(p=>new VRMLoaderPlugin(p));
  const g=await loader.loadAsync(url); vrm=g.userData.vrm;
  VRMUtils.rotateVRM0(vrm); scene.add(vrm.scene); baseRot=vrm.scene.rotation.y;
  mixer=new THREE.AnimationMixer(vrm.scene);
  return true;
};
const clips={};
window.pose=async(fbx,t,turn,expr)=>{
  if(!clips[fbx]) clips[fbx]=await loadHumanoidAnimation(fbx,vrm);
  mixer.stopAllAction(); vrm.humanoid.resetNormalizedPose();
  const a=mixer.clipAction(clips[fbx]); a.reset(); a.play();
  mixer.setTime(Math.min(t, clips[fbx].duration-0.01));
  vrm.scene.rotation.y=baseRot+(turn||0);
  try{ const em=vrm.expressionManager; ['happy','relaxed','surprised','fun'].forEach(n=>{try{em.setValue(n,0)}catch(e){}}); if(expr) em.setValue(expr[0],expr[1]); }catch(e){}
  // settle hair and skirts with the pose held still
  for(let i=0;i<120;i++) vrm.update(1/60);
  const box=new THREE.Box3().setFromObject(vrm.scene); const size=box.getSize(new THREE.Vector3()); const c=box.getCenter(new THREE.Vector3());
  const hfit=(size.y/2)/Math.tan(THREE.MathUtils.degToRad(13));
  const wfit=(size.x/2)/(Math.tan(THREE.MathUtils.degToRad(13))*(W/H));
  const dist=Math.max(hfit,wfit)*1.06;
  cam.position.set(c.x,c.y+size.y*0.03,c.z+dist); cam.lookAt(c.x,c.y,c.z);
  r.render(scene,cam);
  return true;
};
