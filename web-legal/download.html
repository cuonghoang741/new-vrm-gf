<link rel="stylesheet" href="/style.css">
<script>
  // One link for every bio and post: phones go straight to their store,
  // everything else gets the page with both badges.
  (function () {
    var ua = navigator.userAgent || "";
    var play = "https://play.google.com/store/apps/details?id=com.truemate.girlfriend&referrer=utm_source%3Ddownload_link";
    var appStore = "https://apps.apple.com/app/id6760695348";
    if (/android/i.test(ua)) location.replace(play);
    else if (/iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && "ontouchend" in document)) location.replace(appStore);
    else location.replace("/");
  })();
</script>
